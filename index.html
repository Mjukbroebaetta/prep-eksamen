<!DOCTYPE html>
<html lang="no">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title></title>
	</head>
	<body>
		<script>
		</script>

		<div id="header">
			<h1>Digitrade login</h1>
		</div>
		<div id="menu">
			<a href="/register">Register</a>
			{% if logged_in_as != 'n/a' %}
			<a href="{{ url_for('logout') }}">Logg ut</a>
			{% endif %}
		</div>
		<div id="main">
			<form action="/login" method="post">
				<p>Username:</p><br>
				<input type="text" id="username" name="username">
				<p>Password:</p><br>
				<input type="password" id="password" name="password"><br>
				<input type="submit" value="Login">
			</form>
		</div>

		<p>Logged in as: <span id="username-display">{{ logged_in_as }}</span></p>
		<p>Auth level: <span id="auth-level-display">{{ auth_level }}</span></p>

	</body>
</html>
